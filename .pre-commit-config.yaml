# Runs before every commit on your laptop. Install once with: uv run pre-commit install
# Hook versions are pinned to exact commits ("frozen"), for the same reason as in CI.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f368fb366ff7f2f808dd324b83a6d32267799e19 # frozen: v0.17.2
    hooks:
      - id: ruff-check # lint, and fix what can be fixed automatically
        args: [--fix]
      - id: ruff-format # format the code (same style as Black)
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks # blocks the commit if it contains an API key or other secret
