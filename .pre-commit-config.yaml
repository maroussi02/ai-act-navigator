# Runs before every commit on your laptop. Install once with: uv run pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check # lint, and fix what can be fixed automatically
        args: [--fix]
      - id: ruff-format # format the code (same style as Black)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks # blocks the commit if it contains an API key or other secret
