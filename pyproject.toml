[project]
name = "ai-act-navigator"
version = "0.1.0"
description = "Ask questions about the EU AI Act and get answers that cite the exact article."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "torch>=2.14.1",
]

# Installs the `ai-act` command: `uv run ai-act ...` calls ai_act_navigator.cli.run().
[project.scripts]
ai-act = "ai_act_navigator.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs real data or the real model (slower)",
    "paid: calls the Claude API and costs money; only runs with --run-paid (see tests/conftest.py)",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

# On Linux (CI), install the CPU-only build of PyTorch. The default Linux build bundles
# ~2 GB of GPU (CUDA) libraries we don't need. On Mac the normal build is already small.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
