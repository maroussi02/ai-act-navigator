name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the token every step can use is read-only.
permissions:
  contents: read
  pull-requests: read # gitleaks reads the list of commits in a PR

# Actions are pinned to an exact commit (the long hash), not a tag like "v6": a tag can be
# moved to different code later, a commit hash can't. The comment shows the version.

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # full history so gitleaks can scan every commit
          persist-credentials: false # don't leave the token on disk for later steps

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false # findings fail the check; no PR write access needed

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        run: uv sync --locked

      # Keep the local models (embedding ~130 MB, reranker ~90 MB) between runs instead of
      # downloading them every time.
      - name: Cache the local models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          # Tied to the files that pin the models: changing a model or its pinned revision
          # starts a fresh cache.
          key: hf-${{ runner.os }}-${{ hashFiles('src/ai_act_navigator/embed.py', 'src/ai_act_navigator/rerank.py') }}

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Download the official AI Act text
        run: uv run python -m ai_act_navigator.download

      - name: Run tests (unit + integration)
        run: uv run pytest

      # Smoke tests: run the real commands like a user would and check they produce output.
      # Catches "all tests green but the program crashes" (e.g. a broken entry point).
      - name: Smoke test - ai-act --help
        run: uv run ai-act --help

      - name: Smoke test - ai-act index
        # Must index chunks, and none may be cut off by the model's 512-token limit.
        run: |
          uv run ai-act index | tee index.log
          test -s data/chunks.jsonl
          grep -qE "Indexed [0-9]+ chunks .*\(0 truncated" index.log
