name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # lets gitleaks comment on a PR if it finds a secret

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history so gitleaks can scan every commit

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Download the official AI Act text
        run: uv run python -m ai_act_navigator.download

      - name: Run tests (unit + integration)
        run: uv run pytest

      # Smoke test: run the real command like a user would and check it produced output.
      # Catches "all tests green but the program crashes" (e.g. a broken main()).
      - name: Smoke test - chunking command
        run: |
          uv run python -m ai_act_navigator.chunk
          test -s data/chunks.jsonl || { echo "data/chunks.jsonl is missing or empty"; exit 1; }
